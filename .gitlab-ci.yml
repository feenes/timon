# CI for our self-hosted GitLab CE, run by docker executor runners
# (tag 'docker')
#
# - lint:  isort + flake8
# - test:  pytest on several python versions with coverage.
#          The coverage % is shown in pipelines / MRs (and the coverage
#          badge), coverage.xml annotates changed lines in MR diffs and
#          nosetests.xml shows test results in the MR's test report.

stages:
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

default:
  tags:
    - docker
  cache:
    key: "pip-$CI_JOB_IMAGE"
    paths:
      - .cache/pip

lint:
  stage: test
  image: python:3.11
  script:
    - python -m pip install flake8 isort
    - python -m isort --diff --check setup.py timon
    - python -m flake8 timon setup.py --exclude timon/webclient

test:
  stage: test
  image: python:$PYTHON_VERSION
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.11", "3.12"]
  script:
    - python -m pip install -e . -r requirements/tox.txt
    - >-
      python -m pytest
      --cov --cov-report=term --cov-report=xml:coverage.xml
  coverage: '/^TOTAL.+?(\d+(?:\.\d+)?%)$/'
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - coverage.xml
    reports:
      junit: nosetests.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
